<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЖЕЛЕЗОПК — Панель администратора</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <a href="index.html" class="btn-back">← Назад в каталог</a>
    
    <div class="card-box">
      <h2>Панель Администратора</h2>
      <p>Статус: <b style="color: #e91e63;">Администратор</b></p>
    </div>

    <!-- Форма добавления нового товара -->
    <div class="card-box">
      <h3>Добавить новый товар в базу</h3>
      <form id="add-product-form">
        <label>Название видеокарты:</label>
        <input type="text" id="prod-title" placeholder="например, RTX 4080 Super" required>

        <label>Цена (в тенге):</label>
        <input type="number" id="prod-price" placeholder="550000" required>

        <label>Ссылка на изображение (URL):</label>
        <input type="url" id="prod-img" placeholder="https://..." required>

        <label>Описание:</label>
        <textarea id="prod-desc" rows="3" placeholder="Описание характеристик..."></textarea>

        <button type="submit" class="btn-submit">Добавить товар</button>
      </form>
    </div>

    <!-- Управление текущими товарами (Удаление) -->
    <div class="card-box">
      <h3>Управление товарами в каталоге</h3>
      <div id="admin-products-list">Загрузка товаров...</div>
    </div>

    <!-- Все заказы пользователей -->
    <div class="card-box">
      <h3>Все заказы покупателей</h3>
      <div id="all-orders-list">Загрузка всех заказов...</div>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
